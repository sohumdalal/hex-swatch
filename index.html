<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swatch — hex to PNG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23da291c'/></svg>">
<style>
  /* Ferrari design system — see ../DESIGN.md.
     One deliberate departure: the CTA and the wordmark take the live swatch colour
     instead of Rosso Corsa, so the whole page hydrates with whatever you're holding. */
  :root {
    --primary: #da291c;
    --ink: #ffffff;
    --body: #969696;
    --muted: #666666;
    --hairline: #303030;
    --canvas: #181818;
    --canvas-elevated: #303030;
    --canvas-light: #ffffff;
    --on-light: #181818;

    --xxxs: 4px; --xxs: 8px; --xs: 16px; --sm: 24px; --md: 32px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

    /* the whole layout is sized off this — the page never scrolls */
    --stage: clamp(240px, 62dvh, 620px);
    --accent: #da291c;
    --on-accent: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100dvh;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: 1fr auto;
    justify-items: center;
    padding: var(--sm);
  }

  main {
    align-self: center;
    display: grid;
    grid-template-columns: var(--stage) minmax(300px, 336px);
    align-items: center;
    gap: var(--md);
  }

  /* --- left: the swatch. Square stage, so flat/chip never shifts the layout --- */
  .stage { width: var(--stage); height: var(--stage); display: grid; place-items: center; }

  /* Two blocks, no frame: colour on top, white band with the hex beneath.
     3:4 card — the colour is 75% of the height, the band the remaining 25%. */
  .chip {
    height: 100%;
    aspect-ratio: 3 / 4;
    container-type: inline-size;
    background: var(--canvas-light);
    margin: 0;
    display: flex;
    flex-direction: column;
  }
  .chip[data-style="flat"] { aspect-ratio: 1 / 1; }
  .chip[data-style="flat"] .chip-label { display: none; }

  .chip-color {
    width: 100%; height: 75%;
    background: var(--swatch, #da291c);
    transition: background-color 160ms linear;
  }
  .chip[data-style="flat"] .chip-color { height: 100%; }

  /* cqw keeps the preview a true scale model of the exported file */
  .chip-label {
    height: 25%;
    display: flex; align-items: center;
    padding: 0 6.667cqw;
    color: var(--on-light);
  }
  .chip-hex {
    font-size: 9.333cqw; font-weight: 500; line-height: 1;
    letter-spacing: -0.01em; margin: 0;
  }

  /* --- right: controls --- */
  .panel { display: flex; flex-direction: column; gap: var(--xs); min-width: 0; }

  .masthead { display: flex; align-items: center; gap: 10px; }
  .mark {
    width: 12px; height: 12px; flex-shrink: 0;
    background: var(--accent);
    transition: background-color 160ms linear;
  }
  .wordmark {
    font-size: 12px; font-weight: 600; letter-spacing: 1.1px;
    text-transform: uppercase; margin: 0;
  }
  .wordmark span { color: var(--muted); }

  .input-row { display: flex; gap: var(--xxs); }
  .field { position: relative; flex: 1; min-width: 0; }
  .field::before {
    content: '#';
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 16px; font-weight: 500; pointer-events: none;
  }
  input[type="text"] {
    width: 100%; height: 48px;
    padding: 14px 14px 14px 30px;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    color: var(--ink);
    font-family: var(--font); font-size: 16px; font-weight: 500;
    letter-spacing: 1px; text-transform: uppercase;
  }
  input[type="text"]:focus { outline: none; border-color: var(--ink); }
  input[type="text"].invalid { border-color: var(--primary); }

  .icon-btn {
    width: 48px; height: 48px; flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    color: var(--body);
    cursor: pointer; padding: 0;
    display: grid; place-items: center;
  }
  .icon-btn:hover { border-color: var(--ink); color: var(--ink); }
  .icon-btn svg { width: 17px; height: 17px; }

  .picker { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
  .picker input[type="color"] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; border: 0; padding: 0;
  }
  .picker-face {
    position: absolute; inset: 0;
    border: 1px solid var(--hairline); border-radius: 4px;
    background: var(--swatch, #da291c);
    pointer-events: none;
    transition: background-color 160ms linear;
  }
  .picker:hover .picker-face { border-color: var(--ink); }

  /* --- values: expands in place and pushes the rest down --- */
  .values-trigger {
    display: flex; align-items: center; gap: var(--xxs);
    width: 100%; height: 38px; padding: 0 12px;
    background: transparent; border: 1px solid var(--hairline);
    color: var(--ink); cursor: pointer;
    font-family: var(--font); text-align: left;
  }
  .values-trigger:hover { border-color: var(--body); }
  .values-trigger[aria-expanded="true"] { border-color: var(--ink); border-bottom-color: transparent; }
  .values-trigger .k {
    font-size: 10px; font-weight: 600; letter-spacing: 1.1px;
    text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chev {
    width: 8px; height: 8px; flex-shrink: 0; margin-left: auto;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: translateY(-2px) rotate(45deg);
    transition: transform 240ms cubic-bezier(.2, .7, .2, 1);
  }
  .values-trigger[aria-expanded="true"] .chev {
    transform: translateY(2px) rotate(225deg);
    border-color: var(--ink);
  }

  .values-wrap {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 260ms cubic-bezier(.2, .7, .2, 1);
  }
  .values-wrap[data-open="true"] { grid-template-rows: 1fr; }
  .values-clip { overflow: hidden; }
  .values-menu {
    border: 1px solid var(--ink); border-top: 0;
    opacity: 0; transform: translateY(-8px);
    transition: opacity 200ms ease 40ms, transform 240ms cubic-bezier(.2, .7, .2, 1) 40ms;
  }
  .values-wrap[data-open="true"] .values-menu { opacity: 1; transform: none; }

  .value-row {
    display: flex; align-items: center; justify-content: space-between; gap: var(--xs);
    width: 100%; padding: 8px 12px; line-height: 1.3;
    background: transparent; border: 0; border-top: 1px solid var(--hairline);
    cursor: pointer; font-family: var(--font); text-align: left;
  }
  .value-row:first-child { border-top: 0; }
  .value-row:hover { background: var(--canvas-elevated); }
  .value-row .k {
    font-size: 10px; font-weight: 600; letter-spacing: 1.1px;
    text-transform: uppercase; color: var(--muted);
  }
  .value-row .v {
    font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* segmented controls */
  .seg-row { display: flex; gap: var(--xxs); }
  .seg { display: flex; border: 1px solid var(--hairline); flex: 1; min-width: 0; }
  .seg.style { flex: 2; }
  .seg.format { flex: 3; }
  .seg button {
    flex: 1; height: 38px; min-width: 0;
    background: transparent; border: 0; border-left: 1px solid var(--hairline);
    color: var(--body); cursor: pointer;
    font-family: var(--font); font-size: 10px; font-weight: 600;
    letter-spacing: 1.1px; text-transform: uppercase;
  }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--canvas-elevated); color: var(--ink); }

  .download {
    height: 48px;
    background: var(--accent); color: var(--on-accent);
    border: 0; cursor: pointer;
    font-family: var(--font); font-size: 14px; font-weight: 700;
    letter-spacing: 1.4px; text-transform: uppercase;
    transition: background-color 160ms linear, color 160ms linear;
  }
  /* an inset wash darkens any accent, light or dark */
  .download:hover { box-shadow: inset 0 0 0 999px rgba(0, 0, 0, 0.14); }
  .download:active { box-shadow: inset 0 0 0 999px rgba(0, 0, 0, 0.26); }

  footer {
    align-self: end;
    padding-top: var(--xs);
    font-size: 10px; font-weight: 600; letter-spacing: 1.1px;
    text-transform: uppercase; color: var(--muted);
  }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* one column when there isn't room for two — the chip shrinks to keep it scroll-free */
  @media (max-width: 760px) {
    :root { --stage: clamp(150px, 32dvh, 300px); }
    body { padding: var(--xs); }
    main { grid-template-columns: minmax(0, 340px); gap: var(--xs); justify-items: center; }
    .panel { width: 100%; gap: 10px; }
  }
  /* last resort: a window too short for the design gets a scroll rather than a crop */
  @media (max-height: 460px) { body { overflow: auto; } }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0ms !important; } }
</style>
</head>
<body>
<main>
  <div class="stage">
    <figure class="chip" id="chip" data-style="chip">
      <div class="chip-color" id="chipColor"></div>
      <figcaption class="chip-label">
        <p class="chip-hex" id="chipHex">#DA291C</p>
      </figcaption>
    </figure>
  </div>

  <div class="panel">
    <div class="masthead">
      <div class="mark"></div>
      <h1 class="wordmark">Swatch <span>/ hex to image</span></h1>
    </div>

    <div class="input-row">
      <div class="field">
        <label class="sr" for="hex">Hex colour</label>
        <input id="hex" type="text" value="DA291C" spellcheck="false" autocomplete="off"
               autocapitalize="off" maxlength="9" placeholder="DA291C">
      </div>
      <div class="picker" title="Pick visually">
        <input id="picker" type="color" value="#da291c" aria-label="Pick a colour visually">
        <div class="picker-face"></div>
      </div>
      <button class="icon-btn" id="random" title="Random colour" aria-label="Random colour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="3" width="18" height="18" rx="1"/>
          <circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/>
          <circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>

    <div class="values">
      <button class="values-trigger" id="valuesTrigger" aria-expanded="false" aria-controls="valuesMenu">
        <span class="k" id="valuesLabel">Values</span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="values-wrap" id="valuesWrap" data-open="false">
        <div class="values-clip">
          <div class="values-menu" id="valuesMenu">
            <button class="value-row" data-copy="Hex"><span class="k">Hex</span><span class="v" id="outHex">#DA291C</span></button>
            <button class="value-row" data-copy="Rgb"><span class="k">RGB</span><span class="v" id="outRgb">218, 41, 28</span></button>
            <button class="value-row" data-copy="Hsl"><span class="k">HSL</span><span class="v" id="outHsl">3, 77%, 48%</span></button>
            <button class="value-row" data-copy="Name"><span class="k">Nearest</span><span class="v" id="outName">Rosso Corsa</span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="seg-row">
      <div class="seg style" id="styleSeg" role="group" aria-label="Export style">
        <button data-style="chip" aria-pressed="true">Chip</button>
        <button data-style="flat" aria-pressed="false">Flat</button>
      </div>
      <div class="seg format" id="formatSeg" role="group" aria-label="File format">
        <button data-format="png" aria-pressed="true">PNG</button>
        <button data-format="jpg" aria-pressed="false">JPG</button>
        <button data-format="svg" aria-pressed="false">SVG</button>
      </div>
    </div>

    <div class="seg-row">
      <div class="seg" id="sizeSeg" role="group" aria-label="Pixel width">
        <button data-size="512" aria-pressed="false">512</button>
        <button data-size="1024" aria-pressed="true">1024</button>
        <button data-size="2048" aria-pressed="false">2048</button>
      </div>
    </div>

    <button class="download" id="download">Download PNG</button>
  </div>
</main>

<footer>Created by Sohum Dalal 2026</footer>

<script>
(() => {
  'use strict';

  const NAMES = {
    black:'000000', white:'ffffff', gainsboro:'dcdcdc', silver:'c0c0c0', gray:'808080',
    dimgray:'696969', darkslategray:'2f4f4f', charcoal:'36454f', slategray:'708090',
    lightgray:'d3d3d3', whitesmoke:'f5f5f5', ivory:'fffff0', beige:'f5f5dc',
    linen:'faf0e6', snow:'fffafa', seashell:'fff5ee', cream:'fffdd0',
    red:'ff0000', firebrick:'b22222', crimson:'dc143c', darkred:'8b0000',
    indianred:'cd5c5c', maroon:'800000', tomato:'ff6347', salmon:'fa8072',
    coral:'ff7f50', orangered:'ff4500', orange:'ffa500', darkorange:'ff8c00',
    goldenrod:'daa520', gold:'ffd700', yellow:'ffff00', khaki:'f0e68c',
    olive:'808000', olivedrab:'6b8e23', darkolivegreen:'556b2f',
    yellowgreen:'9acd32', chartreuse:'7fff00', lawngreen:'7cfc00',
    lime:'00ff00', limegreen:'32cd32', green:'008000', darkgreen:'006400',
    forestgreen:'228b22', seagreen:'2e8b57', mediumseagreen:'3cb371',
    springgreen:'00ff7f', mintcream:'f5fffa', teal:'008080', darkcyan:'008b8b',
    cyan:'00ffff', turquoise:'40e0d0', aquamarine:'7fffd4', cadetblue:'5f9ea0',
    steelblue:'4682b4', lightsteelblue:'b0c4de', skyblue:'87ceeb',
    deepskyblue:'00bfff', dodgerblue:'1e90ff', cornflowerblue:'6495ed',
    royalblue:'4169e1', blue:'0000ff', mediumblue:'0000cd', navy:'000080',
    midnightblue:'191970', slateblue:'6a5acd', darkslateblue:'483d8b',
    indigo:'4b0082', purple:'800080', darkviolet:'9400d3', blueviolet:'8a2be2',
    mediumpurple:'9370db', orchid:'da70d6', violet:'ee82ee', plum:'dda0dd',
    magenta:'ff00ff', deeppink:'ff1493', hotpink:'ff69b4', pink:'ffc0cb',
    lightpink:'ffb6c1', rosybrown:'bc8f8f', brown:'a52a2a', sienna:'a0522d',
    saddlebrown:'8b4513', chocolate:'d2691e', peru:'cd853f', tan:'d2b48c',
    wheat:'f5deb3', burlywood:'deb887', bisque:'ffe4c4', peachpuff:'ffdab9',
    lavender:'e6e6fa', thistle:'d8bfd8', mistyrose:'ffe4e1',
    rossocorsa:'da291c', kleinblue:'002fa7', racinggreen:'004225',
    internationalorange:'ff4f00'
  };

  // Every load hydrates a different colour. Five are the chromatic tokens from the
  // Ferrari library (../DESIGN.md) — the rest of that palette is greys — plus three
  // pigments in the same automotive-editorial register.
  const SEEDS = [
    'da291c',  // Rosso Corsa       — colors.primary
    'f13a2c',  // bright red-orange — colors.semantic-warning
    'fff200',  // Hypersail yellow  — colors.accent-yellow-hypersail
    '4c98b9',  // dusty blue        — colors.semantic-info
    '03904a',  // racing green      — colors.semantic-success
    '002fa7',  // Klein Blue
    '004225',  // British Racing Green
    'ff4f00'   // International Orange
  ];

  function seedColour() {
    let last = null;
    try { last = localStorage.getItem('swatch.seed'); } catch {}
    const pool = SEEDS.filter(s => s !== last);
    const pick = pool[Math.floor(Math.random() * pool.length)];
    try { localStorage.setItem('swatch.seed', pick); } catch {}
    return pick;
  }

  const el = id => document.getElementById(id);
  const chip = el('chip'), chipColor = el('chipColor'), chipHex = el('chipHex'),
        input = el('hex'), picker = el('picker'), downloadBtn = el('download'),
        trigger = el('valuesTrigger'), wrap = el('valuesWrap'), menu = el('valuesMenu'),
        label = el('valuesLabel');

  let state = { hex: 'da291c', style: 'chip', format: 'png', size: 1024 };
  let labelTimer;

  /* ---------- colour maths ---------- */

  function normalise(raw) {
    let s = String(raw).trim().replace(/^#/, '').replace(/[^0-9a-fA-F]/g, '').toLowerCase();
    if (s.length === 4) s = s.slice(0, 3);          // #rgba -> #rgb
    if (s.length === 3) s = s.split('').map(c => c + c).join('');
    if (s.length === 8) s = s.slice(0, 6);          // #rrggbbaa -> #rrggbb
    return s.length === 6 ? s : null;
  }

  const toRgb = hex => ({
    r: parseInt(hex.slice(0, 2), 16),
    g: parseInt(hex.slice(2, 4), 16),
    b: parseInt(hex.slice(4, 6), 16)
  });

  function toHsl({ r, g, b }) {
    const rn = r / 255, gn = g / 255, bn = b / 255;
    const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
    const l = (max + min) / 2;
    const d = max - min;
    if (!d) return { h: 0, s: 0, l: Math.round(l * 100) };
    const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    let h;
    if (max === rn) h = ((gn - bn) / d + (gn < bn ? 6 : 0));
    else if (max === gn) h = (bn - rn) / d + 2;
    else h = (rn - gn) / d + 4;
    return { h: Math.round(h * 60), s: Math.round(s * 100), l: Math.round(l * 100) };
  }

  // WCAG relative luminance — decides whether the CTA takes white or ink type
  function luminance({ r, g, b }) {
    const f = v => (v /= 255) <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
    return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
  }

  function nearestName(hex) {
    const c = toRgb(hex);
    let best = null, bestD = Infinity;
    for (const [name, value] of Object.entries(NAMES)) {
      const n = toRgb(value);
      // weighted euclidean — cheap, and closer to perceived difference than plain RGB
      const d = 2 * (c.r - n.r) ** 2 + 4 * (c.g - n.g) ** 2 + 3 * (c.b - n.b) ** 2;
      if (d < bestD) { bestD = d; best = name; }
    }
    return best.replace(/^(dark|light|medium|deep|pale)/, '$1 ')
               .replace(/(gray|green|blue|red|pink|violet|orange|brown|cyan|corsa)$/, ' $1')
               .trim().replace(/\s+/g, ' ')
               .replace(/\b\w/g, m => m.toUpperCase());
  }

  /* ---------- rendering ---------- */

  // transient feedback rides on the dropdown's own label
  function say(message) {
    label.textContent = message;
    clearTimeout(labelTimer);
    labelTimer = setTimeout(() => { label.textContent = 'Values'; }, 2000);
  }

  function render() {
    const hex = state.hex;
    const rgb = toRgb(hex);
    const hsl = toHsl(rgb);
    const display = '#' + hex.toUpperCase();
    const root = document.documentElement.style;

    root.setProperty('--swatch', '#' + hex);
    root.setProperty('--accent', '#' + hex);
    // 0.179 is the WCAG crossover where ink overtakes white for contrast
    root.setProperty('--on-accent', luminance(rgb) > 0.179 ? '#181818' : '#ffffff');

    chipColor.style.background = '#' + hex;
    chip.dataset.style = state.style;
    chipHex.textContent = display;
    el('outHex').textContent = display;
    el('outRgb').textContent = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
    el('outHsl').textContent = `${hsl.h}, ${hsl.s}%, ${hsl.l}%`;
    el('outName').textContent = nearestName(hex);
    picker.value = '#' + hex;
    downloadBtn.textContent = 'Download ' + state.format.toUpperCase();
  }

  function setHex(raw, { sync = true } = {}) {
    const hex = normalise(raw);
    if (!hex) { input.classList.add('invalid'); return false; }
    input.classList.remove('invalid');
    state.hex = hex;
    if (sync) input.value = hex.toUpperCase();
    render();
    return true;
  }

  /* ---------- export ---------- */

  // Drawn in a fixed 1200-wide space, then scaled to the chosen size, so the preview
  // and every export size stay identical in proportion. 3:4 card, colour 75% / band 25%.
  const CHIP = { w: 1200, h: 1600, block: 1200, pad: 80 };

  function drawChip(ctx, hex) {
    const { w, h, block, pad } = CHIP;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#' + hex;
    ctx.fillRect(0, 0, w, block);

    ctx.fillStyle = '#181818';
    ctx.textBaseline = 'middle';
    ctx.font = `500 112px 'Inter', -apple-system, system-ui, sans-serif`;
    ctx.fillText('#' + hex.toUpperCase(), pad, block + (h - block) / 2 + 4);
  }

  async function raster(hex, format) {
    const isChip = state.style === 'chip';
    const w = state.size;
    const h = isChip ? Math.round(w * CHIP.h / CHIP.w) : w;
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');

    if (isChip) {
      try { await document.fonts.ready; } catch {}
      ctx.scale(w / CHIP.w, w / CHIP.w);
      drawChip(ctx, hex);
    } else {
      ctx.fillStyle = '#' + hex;
      ctx.fillRect(0, 0, w, h);
    }

    const mime = format === 'jpg' ? 'image/jpeg' : 'image/png';
    return new Promise((resolve, reject) => {
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('encode failed')), mime, 0.95);
    });
  }

  function svg(hex) {
    const up = '#' + hex.toUpperCase();
    const size = state.size;
    if (state.style === 'flat') {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 1 1">
  <title>${up}</title>
  <rect width="1" height="1" fill="${up}"/>
</svg>
`;
    }
    const { w, h, block, pad } = CHIP;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${Math.round(size * h / w)}" viewBox="0 0 ${w} ${h}">
  <title>${up}</title>
  <rect width="${w}" height="${h}" fill="#FFFFFF"/>
  <rect width="${w}" height="${block}" fill="${up}"/>
  <text x="${pad}" y="${block + (h - block) / 2 + 4}" fill="#181818"
        font-family="Inter, -apple-system, system-ui, sans-serif"
        font-size="112" font-weight="500" dominant-baseline="middle">${up}</text>
</svg>
`;
  }

  async function exportImage() {
    const hex = state.hex;
    const { format, style } = state;
    try {
      const blob = format === 'svg'
        ? new Blob([svg(hex)], { type: 'image/svg+xml' })
        : await raster(hex, format);

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${hex}-${style}.${format}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      say(`Saved ${hex}-${style}.${format}`);
    } catch (err) {
      say('Export failed — ' + err.message);
    }
  }

  /* ---------- wiring ---------- */

  input.addEventListener('input', () => {
    const hex = normalise(input.value);
    if (hex) { input.classList.remove('invalid'); state.hex = hex; render(); }
    else { input.classList.add('invalid'); }
  });

  input.addEventListener('blur', () => setHex(input.value || state.hex));

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); setHex(input.value); exportImage(); }
  });

  picker.addEventListener('input', () => setHex(picker.value));

  el('random').addEventListener('click', () => {
    setHex(Math.floor(Math.random() * 0x1000000).toString(16).padStart(6, '0'));
  });

  downloadBtn.addEventListener('click', exportImage);

  function segment(id, key, cast = v => v) {
    el(id).addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      state[key] = cast(btn.dataset[key]);
      for (const b of el(id).querySelectorAll('button')) {
        b.setAttribute('aria-pressed', String(b === btn));
      }
      render();
    });
  }
  segment('styleSeg', 'style');
  segment('formatSeg', 'format');
  segment('sizeSeg', 'size', Number);

  function openValues(open) {
    wrap.dataset.open = String(open);
    trigger.setAttribute('aria-expanded', String(open));
    menu.inert = !open;
  }

  trigger.addEventListener('click', e => {
    e.stopPropagation();
    openValues(wrap.dataset.open !== 'true');
  });

  document.addEventListener('click', async e => {
    const row = e.target.closest('.value-row');
    if (!row) {
      if (!e.target.closest('.values')) openValues(false);
      return;
    }
    const text = el('out' + row.dataset.copy).textContent;
    try { await navigator.clipboard.writeText(text); say('Copied ' + text); }
    catch { say('Copy blocked by the browser'); }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && wrap.dataset.open === 'true') { openValues(false); trigger.focus(); }
  });

  window.addEventListener('hashchange', () => {
    const hex = normalise(location.hash);
    if (hex && hex !== state.hex) setHex(hex);
  });

  openValues(false);
  setHex(normalise(location.hash) || seedColour());
})();
</script>
</body>
</html>
